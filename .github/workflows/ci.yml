name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Verify generated protocol types
        run: python protocol/generate.py --check
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - name: Build Rust workspace
        run: cargo build --locked --workspace --all-targets
      - name: Run Rust tests
        run: cargo test --locked --workspace
      - name: Check Rust lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test and lint the scripted-dialogs test build
        run: |
          cargo test --locked -p brauser --features scripted-dialogs --target-dir target/scripted-dialogs
          cargo clippy --locked -p brauser --all-targets --features scripted-dialogs --target-dir target/scripted-dialogs -- -D warnings
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.14.0"
          cache: npm
      - name: Install TypeScript tooling
        run: npm ci --ignore-scripts
      - name: Check TypeScript types
        run: npm run typecheck
      - name: Lint TypeScript
        run: npm run lint
      - name: Build unpacked Chrome extension
        run: npm run build:extension
      - name: Run extension worker tests
        run: npm run test:extension
      - name: Audit npm lockfile
        run: npm audit --audit-level=high

  cargo-deny:
    name: Rust dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          arguments: --all-features --locked

  dependency-review:
    name: Review new dependencies
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
