[package]
name = "brauser"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
publish = false
description = "Local native messaging host for Brauser"

[features]
# Test-only: dialog children read their answers from a directory named by an
# environment variable instead of showing UI. Debug builds only; see dialog.rs.
scripted-dialogs = []

[dependencies]
anyhow = "1"
cap-std = "4.0"
directories = "6"
hex = "0.4"
brauser-protocol = { path = "../protocol" }
rfd = "0.17.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
time = { version = "0.3", features = ["formatting", "parsing"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
brauser-macos-alert = { path = "../macos-alert" }

[target.'cfg(windows)'.dependencies]
winapi-util = "0.1.11"

[dev-dependencies]
tempfile = "3"

[lib]
name = "brauser_host"
path = "src/lib.rs"

[[bin]]
name = "brauser"
path = "src/main.rs"
